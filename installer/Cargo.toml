[package]
name = "render-bridge-setup"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Desktop setup wizard for the Render Bridge image MCP server"
publish = false

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
rfd = "0.16.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ureq = { version = "3.2.0", features = ["json"] }
url = "2"

[profile.release]
strip = true
